name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel tests (PHP 8.2, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, gd, exif, fileinfo, zip, intl, bcmath
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Views use @vite(), and public/build is gitignored, so the manifest must be built.
      - run: npm ci
      - run: npm run build

      - name: Prepare environment (no real secrets are used in CI)
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan config:clear --ansi

      # phpunit.xml forces an in-memory SQLite database, array cache/session and sync queue.
      - run: php artisan test --ansi

  ml-service:
    name: ML service tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: roktodut-ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: roktodut-ml-service/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
